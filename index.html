<style>
:root{
  /* Casevora 品牌色：深藍、米色、金色 */
  --bg:#f5efe3; --card:#fffdf8; --ink:#16213a; --muted:#5d6779; --line:#e3d9c6;
  --brand:#16213a; --brand2:#22304f; --soft:#f3ece0; --gold:#b8955a; --field:#c9bda6;
  --bad:#b42318; --bad-soft:#fdecea; --ok:#167a3e; --ok-soft:#e6f5ec; --warn:#b45309; --warn-soft:#fff4e0; --info:#1d4f91; --info-soft:#e8f0fb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;border:1px solid var(--field);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 14px}
button:hover{background:var(--soft)}
button.pri{background:var(--brand);border-color:var(--brand);color:#fffdf8;font-weight:700}
button.pri:hover{background:var(--brand2)}
button.dng{color:var(--bad);border-color:#e3a59c}
button.sm{padding:3px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:8px 10px;border:1px solid var(--field);border-radius:8px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:3px}
.req:after{content:" *";color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
/* 標題列（與衛生追蹤、文件追蹤同一套 Casevoras 版面） */
header.topbar{background:var(--brand);color:#fffdf8;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:50}
.tbin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;border-radius:50%;flex:none;display:block;box-shadow:0 0 0 1px rgba(184,149,90,.5),0 2px 8px rgba(0,0,0,.35)}
.bname{font:400 36px/1.05 "Pinyon Script",Georgia,"Times New Roman",serif;color:#e2c891;letter-spacing:.01em}
.bsub{font-size:14px;font-weight:700;opacity:.92;letter-spacing:.14em;margin-top:2px}
.tbmeta{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:10px}
.ver{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;font-size:11.5px}
@media(max-width:600px){.tbmeta{display:none}}
main{max-width:1440px;margin:0 auto;padding:20px 16px 100px}
.appg{display:grid;grid-template-columns:184px minmax(0,1fr);gap:18px;align-items:start}
.appg>*{min-width:0}
.snav{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:10px;padding:10px 12px;background:none;color:var(--muted);font-weight:600}
.snav button:hover{background:#f3ece0;color:var(--ink)}
.snav button.on,.snav button.on:hover{background:var(--brand);color:#fffdf8}
.snav .ic{width:26px;height:26px;border-radius:8px;background:#efe6d5;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none;color:var(--ink)}
.snav button.on .ic{background:var(--gold)}
.sbrand,.slab,.sfoot{display:none}
.alert{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fdecea;color:#8a1c12;border:1px solid #e3a59c;border-left:5px solid #8a1c12;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.7}
.alert .a1{flex:1 1 260px;font-weight:700}
.atag{flex:none;background:#8a1c12;color:#fff;font-weight:700;font-size:12.5px;border-radius:4px;padding:2px 8px;letter-spacing:.1em}
.alink{flex:none;background:transparent;border:1px solid #e3a59c;color:#8a1c12;font-size:13px;padding:4px 10px}
.alink:hover{background:#fff}
.snav .spacer{flex:1}
.hcard{margin-bottom:14px}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ptitle{min-width:0;flex:1 1 360px}
.ptitle h1{font-size:28px;margin:0 0 2px;line-height:1.3}
.eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--gold)}
.eyebrow::before{content:"";width:28px;height:2px;background:var(--gold);border-radius:2px;flex:none}
.ptitle .muted{font-size:14.5px}
.lbadge{flex:none;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:3px 12px;font-weight:700;font-size:12.5px;white-space:nowrap}
.hc-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.hcrumb{font-size:13px;color:var(--muted)}
.hcrumb b{color:var(--ink)}
.ptools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
button.lite{background:var(--card);border-color:var(--line);color:var(--ink);font-size:13.5px;padding:6px 12px}
button.lite:hover{background:#f3ece0}
button.pnew{font-size:13.5px;padding:6px 12px;border:1px solid var(--brand)}
.phd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.phd b{font-size:16px}
.kpi.go{cursor:pointer}.kpi.go:hover{box-shadow:0 0 0 2px var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
/* 表單分區 */
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.sec>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:800;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .no{background:var(--brand);color:#e2c891;border-radius:6px;padding:0 8px;font-size:13px}
details.sec>summary:after{content:"▾";margin-left:auto;color:var(--muted)}
details.sec:not([open])>summary:after{content:"▸"}
details.sec .body{padding:0 16px 16px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px;z-index:20}
.savebar .in{max-width:1440px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dirty{color:var(--warn);font-weight:700;font-size:14px}
/* 照片 */
.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph .bar button{white-space:nowrap}
.ph{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.ph .bar{display:flex;gap:4px;padding:4px;justify-content:space-between;align-items:center;font-size:12px}
.ph .bar span{color:var(--muted)}
.drop{border:2px dashed var(--field);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;background:#fffaf0}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.gtxt{font-size:13.5px} .gtxt p{margin:0 0 6px}
.gn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:700;vertical-align:middle}
.gseg i{font-style:normal;padding:2px 8px;font-size:12px} .gseg i.on{background:var(--brand);color:#fffdf8}

.gk.ok{border-top-color:var(--ok)} .gk.warn{border-top-color:var(--warn)} .gk.bad{border-top-color:var(--bad)}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const p2=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;}
function fmtD(s){if(!s)return '';const [y,m,d]=s.split('-');return `${y}/${+m}/${+d}`;}
function addDays(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const t=new Date(y,m-1,d+n);return `${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`;}
function newId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}

/* ============ 照片：存在 IndexedDB（容量比一般儲存大很多），案件只記照片編號 ============ */
const PDB={db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((ok,no)=>{ const r=indexedDB.open(PDB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>{this.db=r.result;ok(this.db);}; r.onerror=()=>no(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((ok,no)=>{ const t=db.transaction('p',mode), st=t.objectStore('p'); let out; const q=fn(st); if(q) q.onsuccess=()=>{out=q.result;}; t.oncomplete=()=>ok(out); t.onerror=()=>no(t.error); t.onabort=()=>no(t.error); }); },
  put(id,v){return this.tx('readwrite',st=>st.put(v,id));}, get(id){return this.tx('readonly',st=>st.get(id));},
  del(id){return this.tx('readwrite',st=>st.delete(id));}, keys(){return this.tx('readonly',st=>st.getAllKeys());}, clear(){return this.tx('readwrite',st=>st.clear());}
};
const PHC={}; /* 記憶體快取：照片編號 → 圖片資料 */
async function phGet(id){ if(PHC[id]) return PHC[id]; try{ const v=await PDB.get(id); if(v) PHC[id]=v; return v||''; }catch(e){ return ''; } }
/* 壓縮照片：最長邊 1600px、JPEG 品質 0.78 */
function compress(file){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onerror=()=>no(new Error('read'));
  fr.onload=()=>{ const img=new Image(); img.onerror=()=>no(new Error('img')); img.onload=()=>{ const s=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas');
    c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',0.78)); }; img.src=fr.result; };
  fr.readAsDataURL(file); }); }
/* 頁面上的 <img data-ph="編號"> 會自動從 IndexedDB 填入 */
async function fillPhotos(root){ for(const el of (root||document).querySelectorAll('img[data-ph]')){ const v=await phGet(el.dataset.ph); if(v) el.src=v; else el.alt='（照片遺失）'; } }
/* 清單上點小圖：看大圖，同一件有多張可以 ◀ ▶（或鍵盤左右鍵）切換，Esc 或點旁邊關閉 */
async function viewCasePhotos(cid,i){ const c=C.find(x=>x.id===cid); if(!c||!(c.photos||[]).length) return; const L=c.photos; let k=Math.max(0,Math.min(i,L.length-1));
  const m=document.createElement('div'); m.className='modal img'; document.body.appendChild(m);
  const close=()=>{ m.remove(); document.removeEventListener('keydown',key); };
  const draw=async()=>{ const v=await phGet(L[k]); m.innerHTML=`<div class="box"><div class="pvbar"><span>${esc(c.no)}・${k<2?`圖片(${k+1})`:`其他圖片 ${k+1}`}　${k+1} / ${L.length}</span><button id="pvX" aria-label="關閉">✕ 關閉</button></div>${v?`<img src="${v}" alt="圖片 ${k+1}">`:'<div style="color:#fff;padding:40px;text-align:center">（照片遺失）</div>'}${L.length>1?`<button class="pvn pvp" aria-label="上一張">◀</button><button class="pvn pvq" aria-label="下一張">▶</button>`:''}</div>`;
    m.querySelector('#pvX').onclick=close; const pp=m.querySelector('.pvp'), qq=m.querySelector('.pvq'); if(pp) pp.onclick=e=>{ e.stopPropagation(); go(-1); }; if(qq) qq.onclick=e=>{ e.stopPropagation(); go(1); }; };
  const go=d=>{ k=(k+d+L.length)%L.length; draw(); };
  const key=e=>{ if(e.key==='Escape') close(); else if(e.key==='ArrowLeft') go(-1); else if(e.key==='ArrowRight') go(1); };
  m.onclick=e=>{ if(e.target===m) close(); }; document.addEventListener('keydown',key); await draw(); }
function viewPhoto(id){ phGet(id).then(v=>{ if(!v) return; const m=document.createElement('div'); m.className='modal img'; m.innerHTML=`<div class="box"><img src="${v}" alt="異常照片"></div>`; m.onclick=()=>m.remove(); document.body.appendChild(m); }); }

const CAT1_DEF=['供應商','廠內異常'];
const CAT2_DEF=['天然異物','非天然異物','規格不符','風味口感不良','其它品質因素（含包裝／標示不良）','其它異常原因'];
function defaultS(){ return {cat1:CAT1_DEF.map(n=>({n,on:true})),cat2:CAT2_DEF.map(n=>({n,on:true})),stations:[],vendors:[],units:[]}; }
function loadC(){ try{ const a=JSON.parse(localStorage.getItem(KEY_C)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function loadS(){ try{ return fixS(Object.assign(defaultS(),JSON.parse(localStorage.getItem(KEY_S))||{})); }catch(e){ return defaultS(); } }
function fixS(s){ const ol=a=>Array.isArray(a)?a.filter(x=>x&&String(x.n||'').trim()).map(x=>({n:String(x.n).trim().slice(0,40),on:x.on!==false})):[];
  const sl=a=>Array.isArray(a)?[...new Set(a.map(x=>String(x||'').trim()).filter(Boolean).map(x=>x.slice(0,40)))]:[];
  s.cat1=ol(s.cat1); s.cat2=ol(s.cat2); if(!s.cat1.length) s.cat1=defaultS().cat1; if(!s.cat2.length) s.cat2=defaultS().cat2;
  s.stations=sl(s.stations); s.vendors=sl(s.vendors); s.units=sl(s.units); return s; }
let C=loadC(), S=loadS();
function persist(){ try{ localStorage.setItem(KEY_C,JSON.stringify(C)); localStorage.setItem(KEY_S,JSON.stringify(S)); return true; }
  catch(e){ say('儲存失敗！瀏覽器的儲存空間可能已滿。請先「下載備份」，再刪除部分案件。'); return false; } }
const live=()=>C.filter(c=>!c.deleted);
/* 案件編號：發現日期 YYYYMMDD ＋ 當天三碼流水號，例如 20261120001、20261120002（依發現日期編碼；以前匯入的編號不改） */
function genNo(date){ const pre=(date||today()).replace(/-/g,''); let mx=0; C.forEach(c=>{ if(String(c.no||'').startsWith(pre)){ const n=+String(c.no).slice(pre.length)||0; if(n>mx) mx=n; } }); return pre+String(mx+1).padStart(3,'0'); }
/* 案件狀態由內容自動判斷，不會跟資料互相矛盾 */
/* 預計完成日期：沒填就用「發現日期＋15 天」 */
const DUE_DAYS=15;
function dueOf(c){ return c.due||(c.date?addDays(c.date,DUE_DAYS):''); }
function statusOf(c){ if(c.closeDate) return 'done'; const t=today(), du=dueOf(c); if(du&&du<t) return 'over'; if(du&&du<=addDays(t,3)) return 'soon';
  const tracking=[c.method,c.immediate,c.corrective,c.preventive,c.progress,c.result].some(v=>String(v||'').trim()); return tracking?'track':'open'; }
const URG={over:0,soon:1,track:2,open:2,done:3};
const ST={open:['未處理','open'],track:['改善追蹤中','track'],soon:['即將到期','soon'],over:['逾期未結','over'],done:['已結案','done']};
function stBadge(c){ const s=ST[statusOf(c)]; return `<span class="st ${s[1]}">${s[0]}</span>`; }
function catTag(c){ return `${c.cat1?`<span class="tag ${c.cat1==='供應商'?'sup':'fac'}">${esc(c.cat1)}</span>`:''}${c2Tok(c.cat2).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}`; }
/* 常用選項：設定頁維護的＋曾經輸入過的 */
function optsOf(kind,field){ if(field==='station') return [...new Set([...S.stations,...live().flatMap(c=>stTok(c.station))])]; return [...new Set([...S[kind],...live().map(c=>String(c[field]||'').trim()).filter(Boolean)])]; }
/* 工作站：同一個單位的不同寫法統一成一個名稱；一件可以有兩個以上工作站（用「、」分開） */
const ST_ALIAS={'生產包裝組':'包裝組','生產課包裝組':'包裝組','生產課-包裝組':'包裝組','打漿':'打漿組','生產':'生產課','生產課-儲運組':'儲運組','生產課儲運組':'儲運組','儲運':'儲運組'};
function normStation(x){ const t=String(x||'').replace(/\s+/g,'').replace(/[－—–‐]/g,'-'); return ST_ALIAS[t]||t; }
function stTok(v){ return [...new Set(String(v||'').split(/[、,，;；\/／]+/).map(normStation).filter(Boolean))]; }
const stJoin=a=>[...new Set(a)].join('、');
/* 分類二（異常原因）可以複選，用「、」分開；統計時分開計算 */
function c2Tok(v){ return [...new Set(String(v||'').split(/[、,，;；]+/).map(x=>x.trim()).filter(Boolean))]; }
function valsOf(c,f){ if(f==='station'){ const t=stTok(c.station); return t.length?t:['']; } if(f==='cat2'){ const t=c2Tok(c.cat2); return t.length?t:['']; } return [String(c[f]||'').trim()]; }
/* 處理天數：發現日期 → 結案日期（還沒結案就是到今天已經過幾天） */
function procDays(c){ return c.closeDate&&c.date?daysBetween(c.date,c.closeDate):null; }
function openDays(c){ return !c.closeDate&&c.date?daysBetween(c.date,today()):null; }

async function formDel(){ if(dirty&&!(await ask('有尚未儲存的修改，確定要放棄修改並刪除這件嗎？','放棄修改',true))) return;

async function saveForm(){
  const c=cur; ['no','item','desc','station','vendor','lot'].forEach(k=>c[k]=String(c[k]||'').trim()); c.no=c.no.slice(0,30); c.station=stJoin(stTok(c.station));
  if(c.no&&C.some(x=>x.id!==c.id&&String(x.no)===c.no)){ await say(`案件編號「${c.no}」已經有別的案件在用了（也可能在「最近刪除」裡），請換一個，或留空白自動產生。`); return; }
  if(!c.date){ await say('請先填寫：發現日期'); return; } if(!c.item&&!c.desc){ await say('「產品品項」或「異常描述」至少要填一個。'); return; }
  if(c.closeDate&&c.closeDate<c.date){ await say('結案日期不能早於發現日期。'); return; }
  if(c.due&&c.due<c.date){ await say('預計完成日期不能早於發現日期。'); return; }
  const now=new Date().toISOString(), old=C.findIndex(x=>x.id===c.id), rec={id:c.id,no:c.no||genNo(c.date),photos:c.photos.slice(),createdAt:c.createdAt||now,updatedAt:now};
  FIELDS.forEach(k=>rec[k]=c[k]||''); const prev=old>=0?C[old]:null;
  if(old>=0) C[old]=rec; else C.push(rec);
  /* 新輸入的工作站／廠商／負責單位，自動加進常用選項 */
  const oS=JSON.stringify(S); if(rec.vendor&&!S.vendors.includes(rec.vendor)) S.vendors.push(rec.vendor);
  if(!persist()){ if(prev) C[old]=prev; else C.pop(); S=JSON.parse(oS); return; }
  for(const id of c._removed){ try{ await PDB.del(id); }catch(e){} delete PHC[id]; }
  dirty=false; cur=null; toast(old>=0?'已儲存 ✦':`已新增案件 ${rec.no} ✦`); const to=back==='stats'?'stats':'list'; back='list'; page=to; (to==='stats'?renderStats:renderList)(); window.scrollTo(0,0);
}

let stV='month', stY=null, stM=null, stQ=null, STB=[];
const lastDay=(y,m)=>new Date(y,m,0).getDate();
function stInit(){ if(stY===null){ const t=today(); stY=+t.slice(0,4); stM=+t.slice(5,7); stQ=Math.ceil(stM/3); } }
function stA(){ return stV==='month'?stM:stV==='quarter'?stQ:0; }
function pRange(v,y,a){
  if(v==='month') return {start:`${y}-${p2(a)}-01`,end:`${y}-${p2(a)}-${p2(lastDay(y,a))}`,label:`${y} 年 ${a} 月`};
  if(v==='quarter'){ const m1=(a-1)*3+1,m3=a*3; return {start:`${y}-${p2(m1)}-01`,end:`${y}-${p2(m3)}-${p2(lastDay(y,m3))}`,label:`${y} 年第 ${a} 季（${m1}～${m3} 月）`}; }
  return {start:`${y}-01-01`,end:`${y}-12-31`,label:`${y} 年`}; }
function pShift(v,y,a,k){ if(v==='month'){ const t=y*12+a-1+k; return {y:Math.floor(t/12),a:t%12+1}; }
  if(v==='quarter'){ const t=y*4+a-1+k; return {y:Math.floor(t/4),a:t%4+1}; } return {y:y+k,a:0}; }
/* 上期：本期還沒過完時，上期只算到「同一天」（例：11/1～11/19 比 10/1～10/19），才不會拿半個月比整個月 */
function prevRange(v,y,a){ const rg=pRange(v,y,a), pv=pShift(v,y,a,-1), pr=pRange(v,pv.y,pv.a), t=today();
  if(t>=rg.start&&t<rg.end){ const e=addDays(pr.start,daysBetween(rg.start,t)); if(e<pr.end){ pr.end=e; pr.same=true; } } return pr; }
function stCompute(rg){ const a=live(), inP=d=>d&&d>=rg.start&&d<=rg.end, cases=a.filter(c=>inP(c.date));
  const done=cases.filter(c=>statusOf(c)==='done'), over=cases.filter(c=>statusOf(c)==='over'), open=cases.filter(c=>{ const s=statusOf(c); return s!=='done'&&s!=='over'; });
  const ds=done.map(procDays).filter(d=>d!=null&&d>=0), avg=ds.length?Math.round(ds.reduce((a,b)=>a+b,0)/ds.length*10)/10:null;

function chgDays(n,pn){ if(n===pn) return '<span class="chg eq">＝ 持平</span>'; const d=Math.round((n-pn)*10)/10; return `<span class="chg ${d>0?'bad':'good'}" title="上期 ${pn} 天 → 本期 ${n} 天">${d>0?'▲ 多':'▼ 少'} ${Math.abs(d)} 天</span>`; }
function chg(n,pn,good){ if(pn==null) return ''; let t, cls;

const SGRP=[['station','哪個工作站異常最多'],['cat1','分類一（供應商／廠內異常）'],['cat2','分類二（異常原因）排行'],['vendor','廠商排行']];

const LCOL=['#16213a','#b8955a','#1d4f91','#167a3e','#b42318'];
function countBy(list,f){ const m=new Map(); list.forEach(c=>valsOf(c,f).forEach(k=>m.set(k,(m.get(k)||0)+1))); return [...m].sort((x,y)=>y[1]-x[1]||(x[0]===''?1:y[0]===''?-1:x[0].localeCompare(y[0]))); }

function yearRanges(y){ const t=today(), cy=+t.slice(0,4), md=t.slice(5);

function multiHTML(series,months){ if(!series.length) return '<div class="st-note">這一年還沒有資料。</div>';
  return `<figure class="trend">${multiSVG(series,months)}</figure><div class="leg3">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`; }
function multiSVG(series,ms){ const W=640, H=220, L=36, R=12, T=14, B=28, vals=series.flatMap(s=>s.vals).filter(v=>v!=null), mx=Math.max(4,...vals), step=Math.ceil(mx/4), top=step*4;
  const x=i=>L+(W-L-R)*i/11, y=v=>T+(H-T-B)*(1-v/top); let g='';
  for(let k=0;k<=4;k++){ const v=step*k; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3d9c6"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5d6779">${v}</text>`; }
  ms.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5d6779">${m.m}月</text>`; });
  series.forEach(s=>{ const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean); if(!pts.length) return;
    g+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`+pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`).join(''); });
  return `<svg role="img" aria-label="每月件數折線圖" viewBox="0 0 ${W} ${H}" width="100%" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif">${g}</svg>`; }
function pieSVG(st){ const tot=st.reduce((s,x)=>s+x.v,0), cx=100, cy=100, r=88, ri=52; let a0=-Math.PI/2, out='';
  const pt=(a,rr)=>`${(cx+rr*Math.cos(a)).toFixed(2)},${(cy+rr*Math.sin(a)).toFixed(2)}`;
  st.filter(s=>s.v).forEach(s=>{ const f=s.v/tot;
    if(f>=0.9999){ out+=`<circle cx="${cx}" cy="${cy}" r="${(r+ri)/2}" fill="none" stroke="${SCOL[s.k]}" stroke-width="${r-ri}"/>`; return; }
    const a1=a0+f*2*Math.PI, lg=f>0.5?1:0;
    out+=`<path d="M${pt(a0,r)} A${r},${r} 0 ${lg} 1 ${pt(a1,r)} L${pt(a1,ri)} A${ri},${ri} 0 ${lg} 0 ${pt(a0,ri)} Z" fill="${SCOL[s.k]}" stroke="#fff" stroke-width="1.5"/>`; a0=a1; });
  return `<svg role="img" aria-label="處理狀態圓餅圖" viewBox="0 0 200 200" width="200" height="200" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif">${out}<text x="100" y="98" text-anchor="middle" font-size="26" font-weight="700" fill="#16213a">${tot}</text><text x="100" y="120" text-anchor="middle" font-size="13" fill="#5d6779">件</text></svg>`; }
function lineSVG(ms){ const W=640, H=240, L=36, R=12, T=18, B=30, vals=ms.flatMap(m=>[m.nw,m.cl]).filter(v=>v!=null), mx=Math.max(4,...vals), step=Math.ceil(mx/4), top=step*4;
  const x=i=>L+(W-L-R)*i/11, y=v=>T+(H-T-B)*(1-v/top); let g='';
  for(let k=0;k<=4;k++){ const v=step*k; g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3d9c6"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#5d6779">${v}</text>`; }
  ms.forEach((m,i)=>{ g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5d6779">${m.m}月</text>`; });
  const line=(k,col,dash)=>{ const pts=ms.map((m,i)=>m[k]==null?null:[x(i),y(m[k]),m[k]]).filter(Boolean); if(!pts.length) return '';
    return `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" ${dash?'stroke-dasharray="7 4"':''}/>`+
      pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${col}"/>${p[2]?`<text x="${p[0].toFixed(1)}" y="${(p[1]+(dash?15:-7)).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${p[2]}</text>`:''}`).join(''); };
  return `<svg role="img" aria-label="每月新增與結案件數折線圖" viewBox="0 0 ${W} ${H}" width="100%" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif">${g}${line('nw','#16213a')}${line('cl','#167a3e',1)}</svg>`; }
function setStat(k,v){ stInit(); if(k==='v') stV=v; else if(k==='y') stY=+v; else if(k==='m') stM=+v; else if(k==='q') stQ=+v; renderStats(); }

function zipStore(files){ const T=zipStore.t||(zipStore.t=Array.from({length:256},(_,n)=>{ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; return c>>>0; }));
  const crc=d=>{ let c=0xFFFFFFFF; for(let i=0;i<d.length;i++) c=T[(c^d[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0; const u16=v=>[v&255,v>>>8&255], u32=v=>[v&255,v>>>8&255,v>>>16&255,v>>>24&255];
  files.forEach(([name,data])=>{ const nb=enc.encode(name), d=typeof data==='string'?enc.encode(data):data, c=crc(d);
    const common=[...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)];
    const loc=new Uint8Array([...u32(0x04034b50),...common]); parts.push(loc,nb,d);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...common,...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb); off+=loc.length+nb.length+d.length; });
  const cl=cen.reduce((a,b)=>a+b.length,0);
  return new Blob([...parts,...cen,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)])],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}); }
function wx(t){ return String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function wRun(t,o={}){ return `<w:r><w:rPr><w:rFonts w:ascii="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei"/>${o.b?'<w:b/>':''}${o.color?`<w:color w:val="${o.color}"/>`:''}<w:sz w:val="${o.sz||21}"/></w:rPr><w:t xml:space="preserve">${wx(t)}</w:t></w:r>`; }
function wPara(t,o={}){ return `<w:p><w:pPr>${o.keep?'<w:keepNext/>':''}${o.jc?`<w:jc w:val="${o.jc}"/>`:''}<w:spacing w:before="${o.before||0}" w:after="${o.after??80}"/>${o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:''}</w:pPr>${wRun(t,o)}</w:p>`; }
function wTable(rows,head=true){ const B=['top','left','bottom','right','insideH','insideV'].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="C9BDA6"/>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${B}</w:tblBorders><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>`+
    rows.map((r,i)=>`<w:tr>${r.map(c=>`<w:tc><w:tcPr>${head&&i===0?'<w:shd w:val="clear" w:color="auto" w:fill="F3ECE0"/>':''}</w:tcPr>${wPara(c,{b:head&&i===0,sz:19,after:0})}</w:tc>`).join('')}</w:tr>`).join('')+'</w:tbl>'+wPara('',{after:60}); }
async function svgPng(svgEl){ const vb=svgEl.viewBox.baseVal, W=vb.width, H=vb.height, k=2;
  const src=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif"><rect width="100%" height="100%" fill="#fff"/>${svgEl.innerHTML}</svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src); await img.decode();
  const c=document.createElement('canvas'); c.width=W*k; c.height=H*k; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  const b=await new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('png')),'image/png')); return {png:new Uint8Array(await b.arrayBuffer()),w:W,h:H}; }
const ctxt=s=>s.replace(/<[^>]+>/g,'');
/* 圖表轉成圖片：上面標題、下面圖例（跟衛生追蹤的 Word 報表一樣） */
async function chartPng(svgEl,title,legend){ const vb=svgEl.viewBox.baseVal, W=vb.width, H=vb.height, tH=36, lH=legend&&legend.length?30:8, k=2, F='Microsoft JhengHei,PingFang TC,Noto Sans TC,sans-serif';
  let lg='', x=20; (legend||[]).forEach(([n,c,dash])=>{ lg+=`<line x1="${x}" y1="${H+tH+16}" x2="${x+26}" y2="${H+tH+16}" stroke="${c}" stroke-width="3" ${dash?'stroke-dasharray="7 4"':''}/><text x="${x+32}" y="${H+tH+20}" font-size="13" fill="#16213a">${esc(n)}</text>`; x+=46+String(n).length*14; });
  const src=`<svg xmlns="http://www.w3.org/2000/svg" width="${W+24}" height="${H+tH+lH}" viewBox="0 0 ${W+24} ${H+tH+lH}" font-family="${F}"><rect width="100%" height="100%" fill="#fff"/><text x="14" y="25" font-size="15" font-weight="700" fill="#16213a">${esc(title||'')}</text><g transform="translate(12,${tH})">${svgEl.innerHTML}</g>${lg}</svg>`;
  const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src); await img.decode();
  const c=document.createElement('canvas'); c.width=(W+24)*k; c.height=(H+tH+lH)*k; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  const b=await new Promise((ok,no)=>c.toBlob(x=>x?ok(x):no(new Error('png')),'image/png')); return {png:new Uint8Array(await b.arrayBuffer()),w:W+24,h:H+tH+lH}; }

/* ============ 從 Excel 匯入（.xlsx） ============ */
/* 欄位名稱只看括號、冒號「外面」的字：例如「圖片(1)」＝圖片、「分類一：供應商、廠內異常」＝分類一 */
const IMP_MAP=[
  ['no','案件編號',['案件編號','編號']],
  ['date','發現日期',['發現日期','日期']],
  ['station','工作站',['工作站','發生部門','工作站／發生部門','工作站/發生部門']],
  ['item','產品品項',['品項','產品品項','品項名稱','產品']],
  ['vendor','廠商',['廠商','廠商名稱','供應商名稱']],
  ['lot','批號',['批號']],
  ['expiry','有效日期',['效期','校期','有效日期','有效期限']],
  ['desc','異常描述',['異常','異常描述','異常內容']],
  ['ph','圖片(1)、圖片(2)',['圖片','照片','異常照片']],
  ['note','備註',['備註']],
  ['method','處理辦法',['處理辦法','處理方式']],
  ['due','預計完成日期',['預計完成日期','預計完成']],
  ['closeDate','結案日期',['結案日期']],
  ['cat1','分類一',['分類一']],
  ['cat2','分類二',['分類二']]];
const IMP_DATE=['date','expiry','due','closeDate'];
const hdrKey=h=>String(h??'').replace(/[（(\[［【].*$/,'').replace(/[：:].*$/,'').replace(/\s+/g,'').trim();
function impField(h){ const k=hdrKey(h); if(!k) return null; const m=IMP_MAP.find(x=>x[2].includes(k)); return m?m[0]:null; }
const serialDate=n=>new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);
function impDate(v){ if(v==null||v==='') return ''; if(typeof v==='number') return v>20000&&v<80000?serialDate(v):'';
  const m=String(v).trim().match(/^(\d{4})\s*[.\/\-年]\s*(\d{1,2})\s*[.\/\-月]\s*(\d{1,2})/); if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3]; if(mo<1||mo>12||d<1||d>lastDay(y,mo)) return null; return `${y}-${p2(mo)}-${p2(d)}`; }
/* 讀 .xlsx：儲存格文字＋插在儲存格上的圖片（一般「插入圖片」和新版「放在儲存格內」兩種都讀） */
async function readXlsxCAPA(file){
  const buf=new Uint8Array(await file.arrayBuffer()), dv=new DataView(buf.buffer), td=new TextDecoder();
  let e=buf.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--; if(e<0) throw new Error('not zip');
  const n=dv.getUint16(e+10,true), files={}; let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){ const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
    files[td.decode(buf.subarray(p+46,p+46+nl))]={method:dv.getUint16(p+10,true),size:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)}; p+=46+nl+xl+cl; }
  const bin=async name=>{ const f=files[name]; if(!f) return null; const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true), data=buf.subarray(st,st+f.size);
    if(f.method===0) return data; return new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); };
  const read=async name=>{ const b=await bin(name); return b?td.decode(b):null; };
  const xml=t=>new DOMParser().parseFromString(t,'application/xml'), tags=(d,nm)=>[...d.getElementsByTagName(nm)];
  const lname=(d,nm)=>[...d.getElementsByTagName('*')].filter(x=>x.localName===nm);
  const resolve=(base,t)=>{ if(t.startsWith('/')) return t.slice(1); const a=base.split('/'); a.pop(); for(const s of t.split('/')){ if(s==='..') a.pop(); else if(s!=='.') a.push(s); } return a.join('/'); };
  const relsOf=async path=>{ const i=path.lastIndexOf('/'), t=await read(path.slice(0,i)+'/_rels/'+path.slice(i+1)+'.rels'), o={}; if(t) tags(xml(t),'Relationship').forEach(r=>o[r.getAttribute('Id')]=resolve(path,r.getAttribute('Target'))); return o; };
  const ss=[]; const sst=await read('xl/sharedStrings.xml'); if(sst) tags(xml(sst),'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
  const colIdx=ref=>{ let k=0; for(const ch of ref.replace(/\d+/g,'')) k=k*26+ch.charCodeAt(0)-64; return k-1; };
  const mime=nm=>/\.png$/i.test(nm)?'image/png':/\.gif$/i.test(nm)?'image/gif':/\.bmp$/i.test(nm)?'image/bmp':/\.webp$/i.test(nm)?'image/webp':'image/jpeg';
  const blobOf=async path=>{ const b=await bin(path); return b?new Blob([b],{type:mime(path)}):null; };
  /* 新版「放在儲存格內」的圖片：vm 編號 → richData → 圖片檔 */
  let rich=[]; try{ const rv=await read('xl/richData/rdrichvalue.xml'), rr=await read('xl/richData/richValueRel.xml');
    if(rv&&rr){ const rrel=await relsOf('xl/richData/richValueRel.xml'), list=lname(xml(rr),'rel').map(r=>rrel[r.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||r.getAttribute('r:id')]);
      rich=lname(xml(rv),'rv').map(r=>{ const v=lname(r,'v')[0]; return v?list[+v.textContent]:null; }); } }catch(err){ rich=[]; }
  const wrels=await relsOf('xl/workbook.xml'), out=[];
  for(const sh of tags(xml(await read('xl/workbook.xml')),'sheet')){
    const rid=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sh.getAttribute('r:id'), path=wrels[rid]; if(!path) continue;
    const t=await read(path); if(!t) continue; const d=xml(t), rows=[], pics=[];
    tags(d,'row').forEach(rw=>{ const ri=+rw.getAttribute('r')-1, row=[];
      tags(rw,'c').forEach(c=>{ const ty=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], ci=colIdx(c.getAttribute('r')); let val=null;
        if(ty==='s') val=v?ss[+v.textContent]:null; else if(ty==='inlineStr') val=tags(c,'t').map(x=>x.textContent).join('');
        else if(v&&ty!=='e') val=(ty==='str')?v.textContent:(ty==='b'?v.textContent==='1':+v.textContent);
        const vm=c.getAttribute('vm'); if(vm&&rich[+vm-1]) pics.push({r:ri,c:ci,path:rich[+vm-1]}), val=null;
        if(val!=null&&val!=='') row[ci]=val; });
      rows[ri]=row; });
    /* 一般插入的圖片：看圖片左上角落在哪一格 */
    const srels=await relsOf(path);
    for(const dr of tags(d,'drawing')){ const dp=srels[dr.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||dr.getAttribute('r:id')]; if(!dp) continue;
      const dt=await read(dp); if(!dt) continue; const drels=await relsOf(dp), dd=xml(dt);
      for(const an of [...lname(dd,'twoCellAnchor'),...lname(dd,'oneCellAnchor')]){ const fr=lname(an,'from')[0], bl=lname(an,'blip')[0]; if(!fr||!bl) continue;
        const emb=bl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','embed')||bl.getAttribute('r:embed');
        const cc=+lname(fr,'col')[0].textContent, rr=+lname(fr,'row')[0].textContent; if(drels[emb]) pics.push({r:rr,c:cc,path:drels[emb]}); } }
    out.push({name:sh.getAttribute('name'),rows,pics,blobOf}); }
  return out; }
/* 把 Excel 內容整理成案件（還不存），回傳要給使用者確認的摘要 */
function impPlan(sheets){ const plan={add:[],dup:[],empty:0,badDate:[],cols:new Map(),skipCols:new Set(),pics:0};
  const nos=new Set(C.map(c=>String(c.no))), t=today(), sig=o=>[o.date,o.item,o.lot,o.desc].map(x=>String(x||'').trim()).join('|'), sigs=new Set(C.map(sig)); plan.same=0;
  for(const sh of sheets){ let hr=-1;
    for(let r=0;r<Math.min(sh.rows.length,15);r++){ const fs=(sh.rows[r]||[]).map(impField); if(fs.filter(Boolean).length>=3&&(fs.includes('item')||fs.includes('desc'))){ hr=r; break; } }
    if(hr<0) continue; const hdr=sh.rows[hr]||[], fmap=[];
    for(let c=0;c<hdr.length;c++){ if(hdr[c]==null||hdr[c]==='') continue; const f=impField(hdr[c]); if(f){ fmap[c]=f; { const h=String(hdr[c]).replace(/\s+/g,' ').trim(); plan.cols.set(h.length>24?h.slice(0,22)+'…':h,f); } } else plan.skipCols.add(String(hdr[c]).trim()); }
    const phCols=fmap.map((f,c)=>f==='ph'?c:-1).filter(c=>c>=0);
    for(let r=hr+1;r<sh.rows.length;r++){ const row=sh.rows[r]||[], o={id:newId(),photos:[],_pics:[]}; FIELDS.forEach(k=>o[k]='');
      fmap.forEach((f,c)=>{ if(!f||f==='ph'||row[c]==null) return; let v=row[c];
        if(IMP_DATE.includes(f)){ const d=impDate(v); if(d===null){ plan.badDate.push(`第 ${r+1} 列「${String(hdr[c]).trim()}」：${String(v).slice(0,20)}`); if(f==='expiry') o.note=(o.note?o.note+'\n':'')+'效期：'+String(v).trim(); return; } v=d; }
        else if(f==='no'&&typeof v==='number') v=String(Math.round(v));
        o[f]=String(v).trim().slice(0,f==='no'?30:5000); });
      const pics=sh.pics.filter(pc=>pc.r===r&&(phCols.length?phCols.includes(pc.c):true)).sort((a,b)=>a.c-b.c).slice(0,2);
      if(!FIELDS.some(k=>o[k])&&!o.no&&!pics.length){ continue; }
      if(!o.item&&!o.desc){ plan.empty++; continue; }
      if(!o.date) o.date=t;
      if(o.no&&nos.has(o.no)){ plan.dup.push(o.no); continue; }
      if(!o.no&&sigs.has(sig(o))){ plan.same++; continue; } sigs.add(sig(o));
      o._pics=pics.map(pc=>({path:pc.path,blobOf:sh.blobOf})); plan.pics+=o._pics.length;
      if(o.no) nos.add(o.no); plan.add.push(o); } }
  return plan; }
/* 分類：完全一樣就用；是設定裡某個選項的開頭（例：「其它品質因素」→「其它品質因素（含包裝／標示不良）」）就用那個；都沒有就新增到設定 */
function impCat(k,v){ if(!v) return ''; const a=S[k]; if(a.some(x=>x.n===v)) return v; const m=a.find(x=>x.n.startsWith(v)); if(m) return m.n; a.push({n:v.slice(0,40),on:true}); return v.slice(0,40); }
async function importXlsx(inp){ const f=inp.files[0]; inp.value=''; if(!f) return;
  if(typeof DecompressionStream==='undefined'){ await say('這個瀏覽器版本太舊，無法讀取 Excel。請更新 Chrome 或 Edge 後再試。'); return; }
  if(!/\.xlsx$/i.test(f.name)){ await say('請選擇 .xlsx 格式的 Excel 檔。\n如果是舊的 .xls，請先用 Excel 打開，「另存新檔」成 .xlsx 再匯入。'); return; }
  let sheets; try{ sheets=await readXlsxCAPA(f); }catch(e){ await say('無法讀取這個檔案，請確認是 Excel（.xlsx）檔。'); return; }
  const P=impPlan(sheets);
  if(!P.cols.size){ await say('找不到標題列。\n請確認 Excel 有一列標題，至少要有「品項」或「異常」欄，例如：案件編號、發現日期、品項、效期、異常、圖片(1)、圖片(2)。\n可以到「設定與資料」下載匯入範本。'); return; }
  const lab=f=>IMP_MAP.find(x=>x[0]===f)[1];
  const msg=`讀到的欄位（Excel 欄名 → 系統欄位）：\n${[...P.cols].map(([h,f])=>`・${h} → ${lab(f)}`).join('\n')}`+
    (P.skipCols.size?`\n\n沒有對應、不會匯入的欄位：${[...P.skipCols].join('、')}`:'')+
    `\n\n可以匯入：${P.add.length} 件（照片 ${P.pics} 張）`+
    (P.dup.length?`\n略過 ${P.dup.length} 件：案件編號已經存在（${P.dup.slice(0,5).join('、')}${P.dup.length>5?'…':''}）`:'')+
    (P.same?`\n略過 ${P.same} 件：沒有案件編號，但發現日期、品項、批號、異常描述跟現有案件完全一樣`:'')+
    (P.empty?`\n略過 ${P.empty} 列：沒有品項也沒有異常描述`:'')+
    (P.badDate.length?`\n\n看不懂的日期（已留空${P.badDate.some(x=>x.includes('效期')||x.includes('校期'))?'，效期原文放進備註':''}）：\n${P.badDate.slice(0,6).map(x=>'・'+x).join('\n')}${P.badDate.length>6?'\n…':''}`:'')+
    `\n\n沒填發現日期的，會用今天（${fmtD(today())}）；沒填案件編號的，會自動產生。\n匯入只會「新增」案件，不會覆蓋或刪除系統裡原本的案件。`;
  if(!P.add.length){ await say(msg+'\n\n沒有可以匯入的案件。'); return; }
  if(!(await ask(msg,`匯入 ${P.add.length} 件`))) return;
  toast('正在匯入…'); const oC=JSON.stringify(C), oS=JSON.stringify(S), newPh=[], now=new Date().toISOString(); let badPh=0;
  for(const o of P.add){
    for(const pc of o._pics){ try{ const b=await pc.blobOf(pc.path); if(!b) throw 0; const data=await compress(b), id='ph_'+newId(); await PDB.put(id,data); PHC[id]=data; newPh.push(id); o.photos.push(id); }catch(e){ badPh++; } }
    o.cat1=impCat('cat1',o.cat1); o.cat2=c2Tok(o.cat2).map(x=>impCat('cat2',x)).join('、'); o.station=stJoin(stTok(o.station));

  download(blob,`CAPA_backup_${today()}.json`); }
async function restore(inp){ const f=inp.files[0]; inp.value=''; if(!f) return; let d;
  try{ d=JSON.parse(await f.text()); if(!d||d.app!=='casevoraCAPA'||!Array.isArray(d.cases)) throw 0; }catch(e){ await say('無法讀取：這不是本系統的備份檔。'); return; }
  const ok=d.cases.every(c=>c&&/^[\w-]{1,40}$/.test(String(c.id))&&/^\d{4}-\d{2}-\d{2}$/.test(String(c.date||''))); if(!ok){ await say('無法還原：備份檔內有格式不正確的案件。'); return; }
  if(!(await ask(`備份檔內有 ${d.cases.filter(c=>!c.deleted).length} 件案件、${Object.keys(d.photos||{}).length} 張照片。\n還原會「取代」這台電腦目前的 ${live().length} 件案件和所有照片，確定嗎？`,'取代並還原',true))) return;
  const cases=d.cases.map(c=>{ const o={id:String(c.id),no:String(c.no||'').slice(0,30),photos:(Array.isArray(c.photos)?c.photos:[]).filter(p=>/^ph_[\w-]{1,40}$/.test(String(p))),createdAt:String(c.createdAt||''),updatedAt:String(c.updatedAt||'')};
    FIELDS.forEach(k=>o[k]=String(c[k]??'')); if(c.deleted){ o.deleted=true; o.deletedAt=/^\d{4}-\d{2}-\d{2}$/.test(String(c.deletedAt))?c.deletedAt:today(); } return o; });
  try{ await PDB.clear(); for(const [id,v] of Object.entries(d.photos||{})){ if(/^ph_[\w-]{1,40}$/.test(id)&&/^data:image\//.test(String(v))) await PDB.put(id,v); } }catch(e){ await say('照片還原失敗，瀏覽器空間可能不夠。'); return; }
  Object.keys(PHC).forEach(k=>delete PHC[k]); const oC=C, oS=S; C=cases; S=fixS(Object.assign(defaultS(),d.settings||{}));
  if(!persist()){ C=oC; S=oS; return; } toast('還原完成 ✦'); page='list'; renderList(); }

/* 一次性整理：工作站不同寫法統一（包裝組、打漿組、生產課、儲運組…），分類全部啟用 */
function migrateStations(){ let n=0; C.forEach(c=>{ const v=stJoin(stTok(c.station)); if(v!==String(c.station||'')){ c.station=v; n++; } });
  const st=[...new Set(S.stations.map(normStation).filter(Boolean))], stCh=JSON.stringify(st)!==JSON.stringify(S.stations); S.stations=st;
  let catCh=false; ['cat1','cat2'].forEach(k=>S[k].forEach(x=>{ if(!x.on){ x.on=true; catCh=true; } }));
  if(n||stCh||catCh){ if(persist()&&n) toast(`已把 ${n} 件的工作站名稱統一（例：生產包裝組 → 包裝組）`); } }
/* ============ 啟動 ============ */
(async function init(){
  let ok=true; try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); await PDB.open(); }catch(e){ ok=false; }
  if(!ok) say('注意：目前瀏覽器無法保存資料（可能是無痕模式或已封鎖網站資料），關閉後資料會遺失。');
  await purgeExpired(); migrateStations(); renderList();
})();
</script>
